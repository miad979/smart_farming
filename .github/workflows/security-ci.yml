name: Security CI

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Disposable Postgres for the production redeploy-persistence check. Uses the PostgreSQL that is
      # preinstalled on GitHub's Ubuntu runners (no service container).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER sftest WITH PASSWORD 'sftest';" -c "CREATE DATABASE sftest OWNER sftest;"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backend syntax check
        run: node -c server/local-api.cjs

      - name: Build
        run: npm run build

      - name: Automated security integration tests
        env:
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
        run: npm run test:security

      - name: Consultation, account and document-ownership workflow
        run: npm run test:consultations

      - name: Production readiness (prod mode, demo passwords, proxy IPs, static server, redeploy persistence)
        env:
          TEST_DATABASE_URL: postgresql://sftest:sftest@127.0.0.1:5432/sftest
        run: npm run test:production

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Upload audit report (always)
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Store audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
